<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f1e1c'/%3E%3Ctext x='16' y='23' font-size='16' text-anchor='middle' fill='%23f6f5f2' font-family='sans-serif'%3EC%3C/text%3E%3C/svg%3E">
<title>Cintserの宅记</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">Cintser<span class="no">の</span>宅记<span class="ver" id="ver"></span></div>

    <nav class="tabs" id="tabs"></nav>

    <div class="stats" id="stats"></div>

    <div class="spacer"></div>

    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="M16.5 16.5L21 21" stroke-linecap="round"></path></svg>
      <input id="search" type="search" placeholder="搜索片名 / 拼音" autocomplete="off">
    </div>

    <button class="btn" id="btn-import">导入</button>
    <button class="btn" id="btn-json">导出数据</button>
    <button class="btn btn-primary" id="btn-note">导出笔记</button>
    <span class="editpill" id="editpill" title="点击退出编辑模式（或按 Esc）">编辑模式<span class="px">✕</span></span>
    <input type="file" id="file" accept=".txt,.json" hidden>
  </div>
  <div class="filters" id="filters"></div>
</header>

<div class="banner hide" id="banner"></div>

<main>
  <div class="layout">
    <div id="list"></div>
    <aside class="side" id="side"></aside>
  </div>
</main>

<script src="assets/lib.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
